spring:
  application:
    name: expense-tracker
  datasource:
    url: ${dataSourceUrl}
    username: ${dataSourceUsername}
    password: ${dataSourcePassword}
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration
    enable: true

security:
  jwt:
    secret-key: ${jwtSecretKey}
    expiration-time: 300000
    refresh-expiration-time: 2592000000